[package]
name = "autosrt"
version = "2026.10.1"
edition = "2024"
description = "Local speech-to-SRT pipeline with a terminal UI"
license = "MIT"
repository = "https://github.com/yoophi/autosrt"

[dependencies]
dirs = "7"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ctrlc = "3"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
url = "2"
unicode-segmentation = "1"
unicode-width = "0.2"
